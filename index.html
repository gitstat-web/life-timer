<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Countdown</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent-color: #00ff88;
            --text-color: #e0e0e0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { font-weight: 200; letter-spacing: 4px; color: var(--accent-color); margin-bottom: 0; }
        .end-date { font-size: 0.8rem; opacity: 0.5; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
        }
        .number { display: block; font-size: 1.6rem; font-weight: bold; color: #fff; }
        .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; }
        .progress-container {
            width: 100%;
            max-width: 900px;
            background: #222;
            height: 8px;
            border-radius: 4px;
            margin-top: 40px;
        }
        #progress-bar { height: 100%; background: var(--accent-color); width: 0%; transition: width 1s linear; }
    </style>
</head>
<body>

    <h1>MEMENTO MORI</h1>
    <div class="end-date">Estimated: Dec 31, 2062</div>

    <div class="grid">
        <div class="card"><span class="number" id="years">--</span><span class="label">Years</span></div>
        <div class="card"><span class="number" id="quarters">--</span><span class="label">Quarters</span></div>
        <div class="card"><span class="number" id="months">--</span><span class="label">Months</span></div>
        <div class="card"><span class="number" id="weeks">--</span><span class="label">Weeks</span></div>
        <div class="card"><span class="number" id="days">--</span><span class="label">Days</span></div>
        <div class="card"><span class="number" id="hours">--</span><span class="label">Hours</span></div>
        <div class="card"><span class="number" id="minutes">--</span><span class="label">Minutes</span></div>
        <div class="card"><span class="number" id="seconds">--</span><span class="label">Seconds</span></div>
    </div>

    <div class="progress-container"><div id="progress-bar"></div></div>

    <script>
        function updateTimer() {
            try {
                // Using explicit numbers for the date to avoid timezone/format errors
                // Date(year, monthIndex, day, hours, minutes, seconds)
                // Note: Month is 0-indexed (0=Jan, 9=Oct)
                const birthDate = new Date(1987, 9, 1); 
                const deathDate = new Date(2062, 12, 31);
                const now = new Date();
                
                const diff = deathDate - now;
                const totalLife = deathDate - birthDate;

                if (diff <= 0) {
                    document.querySelector('h1').innerText = "TIME EXPIRED";
                    return;
                }

                // Math constants
                const second = 1000;
                const minute = second * 60;
                const hour = minute * 60;
                const day = hour * 24;
                const yearMs = day * 365.25;

                // Value Calculations
                const y = diff / yearMs;
                const q = y * 4;
                const m = y * 12;
                const w = diff / (day * 7);
                const d = diff / day;
                const hr = diff / hour;
                const min = diff / minute;
                const sec = diff / second;

                // Push to Screen
                document.getElementById('years').innerText = y.toFixed(2);
                document.getElementById('quarters').innerText = q.toFixed(1);
                document.getElementById('months').innerText = Math.floor(m).toLocaleString();
                document.getElementById('weeks').innerText = Math.floor(w).toLocaleString();
                document.getElementById('days').innerText = Math.floor(d).toLocaleString();
                document.getElementById('hours').innerText = Math.floor(hr).toLocaleString();
                document.getElementById('minutes').innerText = Math.floor(min).toLocaleString();
                document.getElementById('seconds').innerText = Math.floor(sec).toLocaleString();

                // Progress Bar
                const lived = now - birthDate;
                const percent = (lived / totalLife) * 100;
                document.getElementById('progress-bar').style.width = percent + "%";

            } catch (err) {
                console.log("Timer Error:", err);
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
